# Lo que se comprueba solo, en cada empujón.
#
# ## Por qué existe esto
#
# Hasta el 1 de octubre de 2026 este repositorio **no tenía CI**. Y eso no era teórico:
# ese mismo día su suite estuvo en rojo y nadie se enteró —`comprueba-flujo-gestionado`
# daba tres MAL porque PopCar había añadido dos puertas al panel del cliente—. Lo
# encontré ejecutándolo a mano, por casualidad, mientras miraba otra cosa.
#
# Una suite de 2.813 pruebas que nadie lanza es una suite que no existe.
#
# ## Lo que hace y lo que no
#
# Corre lo que se puede comprobar **sin base de datos y sin secretos**:
#
#   - los tipos de las dos aplicaciones, que es lo único que cubre hoy el `strict: true`
#     de `tsconfig.base.json` —y que fuera de aquí solo protege a quien construye en su
#     máquina—;
#   - las 2.813 pruebas;
#   - y que las dos aplicaciones construyan.
#
# **No** corre los ocho `scripts/comprueba-*.js`. Esos leen el `.env` del repositorio con
# `fs.readFileSync` y consultan la base de verdad, así que aquí reventarían por no existir
# el fichero. Hacerlos correr pide dos cosas que no son de hoy: que acepten el entorno
# cuando no hay `.env`, y una base desechable con el esquema —que es justo lo que bloquea
# §19.1, las 280 sentencias de esquema dentro de las peticiones y ninguna migración—.
#
# ## Las variables de mentira
#
# `apps/api/src/config.ts` exige `DATABASE_URL`, `JWT_SECRET` y cuatro contraseñas **al
# importarse**, así que sin ellas no cargan ni las pruebas de lógica pura: medido, 40 de
# ellas se caían sin tocar la base para nada. Con estos valores inventados corren las
# 2.813 y ninguna se conecta a ningún sitio: la cadena apunta al puerto 1 de localhost a
# propósito, para que si alguna lo intentara, fallara en vez de encontrar algo.

name: Validación

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

jobs:
  comprobaciones:
    name: Tipos, pruebas y construcción
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Inventadas y sin valor: ver la cabecera.
      DATABASE_URL: postgres://nadie:nada@127.0.0.1:1/vacio
      JWT_SECRET: solo-para-el-ci-y-no-vale-nada
      ERP_ADMIN_PASSWORD: ci-sin-valor
      ERP_SUPPORT_PASSWORD: ci-sin-valor
      ERP_OPS_PASSWORD: ci-sin-valor
      ERP_SALES_PASSWORD: ci-sin-valor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar
        run: npm ci

      # Los tipos van primero: son lo más rápido y lo que más pronto corta.
      - name: Tipos del API
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Tipos de la web
        run: npx tsc -b apps/web/tsconfig.json

      - name: Las 2.813 pruebas
        run: npm test

      # La construcción al final: si los tipos y las pruebas están bien y esto falla,
      # el problema es del empaquetado y no del código, y conviene saberlo separado.
      - name: Construir
        run: npm run build
